<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAIRN — the archivist's instrument</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ece3d0'/><g fill='%23a9812f'><ellipse cx='16' cy='24' rx='9' ry='3.6'/><ellipse cx='16' cy='17' rx='6.6' ry='3'/><ellipse cx='16' cy='11' rx='4.6' ry='2.4'/><ellipse cx='16' cy='6.2' rx='2.7' ry='1.7'/></g></svg>" />
<style>
  /* CAIRN — a deliberately single-world design: a warm, daylit archive. The art is a
     scholar's bench (magnifier = scrutiny, pocket watch = provenance & staleness,
     manuscript = the record, ammonite = layered knowledge). We commit to that world
     rather than half-render a dark one. NOTE: the CSS variable NAMES below are load-
     bearing — inline styles in the script resolve them — so names are preserved and
     only their VALUES are the parchment palette. */
  :root {
    --bg:#ece3d0; --surface:#f5eedd; --surface2:#e7dcc4; --ink:#2e2617; --muted:#6f6349;
    --line:#d6c7a4; --line2:#c6b489; --accent:#a9812f; --accent-ink:#f7f1e1;
    --brass:#a9812f; --brass-deep:#7c5e1c; --sage:#7c8a63; --sage-deep:#4b5740;
    --ok:#4e6b4a; --bad:#a6533b; --warn:#b0842b; --code:#e7dcc4;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --serif:"Hoefler Text","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --leaf-shadow:0 1px 0 rgba(255,252,244,.6),0 6px 18px -10px rgba(60,46,20,.35);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body {
    background:
      radial-gradient(120% 80% at 15% -10%, #f4ecda 0%, transparent 55%),
      radial-gradient(140% 90% at 100% 0%, #e7dcc2 0%, transparent 45%),
      #ece3d0;
    background-attachment:fixed;
  }
  a { color:var(--brass-deep); text-underline-offset:2px; }

  /* ── masthead: the mounted cinematic plate ── */
  .masthead { position:relative; width:100%; height:clamp(300px,44vh,460px); overflow:hidden;
    border-bottom:1px solid var(--line2); background:#e7dcc2; }
  .masthead img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 38%;
    filter:saturate(1.02); animation:driftIn 1.4s ease-out both; }
  @keyframes driftIn { from { opacity:0; transform:scale(1.04); } to { opacity:1; transform:scale(1); } }
  /* parchment scrims: bottom for the wordmark, a soft left wash for legibility */
  .masthead::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to top, #ece3d0 2%, rgba(236,227,208,.72) 20%, rgba(236,227,208,0) 52%),
      linear-gradient(to right, rgba(236,227,208,.66) 0%, rgba(236,227,208,0) 46%); }
  .plate { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:0 clamp(18px,5vw,54px) clamp(14px,3vh,26px);
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
  .wordmark { }
  .wordmark h1 { margin:0; font-family:var(--serif); font-weight:600; letter-spacing:.14em;
    font-size:clamp(40px,8vw,82px); line-height:.9; color:#241d10;
    text-shadow:0 1px 0 rgba(255,250,240,.5); }
  .wordmark .rule { height:2px; width:min(220px,40vw); margin:14px 0 10px;
    background:linear-gradient(to right, var(--brass), rgba(169,129,47,0)); }
  .wordmark .tag { font-family:var(--serif); font-style:italic; font-size:clamp(14px,1.8vw,18px); color:#4a3f28; max-width:44ch; }
  .wordmark .tag b { font-style:normal; font-weight:600; color:#241d10; }
  .ref { align-self:flex-end; font:600 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:#5c4f34; opacity:.72; white-space:nowrap; }
  .status-wrap { position:absolute; top:16px; right:clamp(16px,5vw,40px); z-index:3; }

  /* ── working surface ── */
  .wrap { max-width:980px; margin:0 auto; padding:clamp(20px,3.4vw,34px) clamp(16px,4vw,40px) 96px; }

  .pill { font:600 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:8px 12px; border-radius:999px;
    border:1px solid var(--line2); color:#5c4f34; background:rgba(245,238,221,.82); backdrop-filter:blur(3px); box-shadow:var(--leaf-shadow); }
  .pill.on { color:var(--sage-deep); border-color:color-mix(in srgb,var(--sage) 55%,transparent); }
  .pill.bad { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent); }

  /* the search instrument — a brass-framed entry on a parchment leaf */
  .instrument { background:var(--surface); border:1px solid var(--line2); border-radius:4px;
    box-shadow:var(--leaf-shadow); padding:16px 16px 14px; margin-top:2px; }
  .eyebrow { font:600 10.5px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--brass-deep); margin:0 2px 10px; }
  .searchbar { display:flex; gap:10px; align-items:stretch; }
  .searchbar input { flex:1; font:400 17px/1.3 var(--serif); color:var(--ink); background:#fbf6ea;
    border:1px solid var(--line2); border-radius:3px; padding:14px 15px; outline:none; box-shadow:inset 0 1px 2px rgba(80,62,26,.06); }
  .searchbar input::placeholder { color:#9a8b6b; font-style:italic; }
  .searchbar input:focus { border-color:var(--brass); box-shadow:inset 0 1px 2px rgba(80,62,26,.06),0 0 0 3px rgba(169,129,47,.16); }
  .go { font:600 14px var(--sans); letter-spacing:.02em; background:linear-gradient(#b78d38,var(--brass)); color:var(--accent-ink);
    border:1px solid var(--brass-deep); border-radius:3px; padding:0 22px; cursor:pointer; box-shadow:0 1px 0 rgba(255,240,210,.4) inset; }
  .go:hover { background:linear-gradient(#c0963d,#a97f2e); }
  .go:disabled { opacity:.5; cursor:not-allowed; }
  .controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .seg { display:inline-flex; background:#eadfc7; border:1px solid var(--line2); border-radius:4px; padding:3px; gap:3px; }
  .seg button { font:600 12.5px var(--sans); border:0; background:transparent; color:#6f6349; padding:7px 15px; border-radius:3px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--brass-deep); box-shadow:var(--leaf-shadow); }
  .ctrl-note { font:italic 400 13px/1.4 var(--serif); color:#6f6349; }
  .auditbtn { font:600 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line2);
    background:var(--surface); color:#5c4f34; padding:9px 13px; border-radius:3px; cursor:pointer; box-shadow:var(--leaf-shadow); }
  .auditbtn:hover { color:var(--brass-deep); border-color:var(--brass); }

  /* ── results: catalog leaves ── */
  #out { margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--leaf-shadow);
    animation:leafIn .4s ease-out both; }
  @keyframes leafIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .answer { border-color:color-mix(in srgb,var(--brass) 42%,var(--line)); box-shadow:0 1px 0 rgba(255,252,244,.6),0 10px 26px -14px rgba(90,60,18,.4); }
  .answer .ahead { display:flex; align-items:center; gap:10px; padding:13px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(#f7f0df,#f2ead6); border-radius:4px 4px 0 0; }
  .badge { font:600 10.5px var(--mono); letter-spacing:.08em; padding:5px 10px; border-radius:3px; border:1px solid var(--line2);
    color:#5c4f34; text-transform:uppercase; }
  .badge.ok { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); background:color-mix(in srgb,var(--ok) 8%,transparent); }
  .badge.bad { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent); background:color-mix(in srgb,var(--bad) 8%,transparent); }
  .answer .abody { padding:18px 20px; font:400 16.5px/1.68 var(--serif); color:#2b2415; }
  .answer .abody sup a { color:var(--brass-deep); text-decoration:none; font-weight:700; font-family:var(--mono); font-size:11px; }
  .cites { display:flex; flex-wrap:wrap; gap:7px; padding:0 20px 16px; }
  .cite { font:600 11px var(--mono); border:1px solid var(--line2); border-radius:3px; padding:5px 9px; color:#5c4f34;
    text-decoration:none; background:#f2ead6; }
  .cite:hover { color:var(--brass-deep); border-color:var(--brass); }

  .hit { padding:15px 20px; }
  .hit .h-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .hit .h-title { font:600 16px var(--serif); color:#2b2415; }
  .hit .h-title .crumb { color:var(--muted); font-weight:400; font-style:italic; }
  .hit .h-meta { font:500 10.5px var(--mono); color:var(--muted); white-space:nowrap; letter-spacing:.03em; }
  .hit .snip { font:400 14.5px/1.62 var(--serif); color:#3a3120; margin:9px 0 11px; }
  .hit .snip mark { background:linear-gradient(to bottom, transparent 55%, rgba(183,138,50,.34) 55%); color:inherit; padding:0 1px; }
  .hit .h-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .h-foot a, .h-foot button { font:600 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line2);
    background:#f2ead6; color:#5c4f34; padding:5px 9px; border-radius:3px; text-decoration:none; cursor:pointer; }
  .h-foot a:hover, .h-foot button:hover { color:var(--brass-deep); border-color:var(--brass); }
  .tag { font:600 10px var(--mono); color:var(--muted); }

  /* refusal — stamped, dignified, never buried */
  .refused { padding:20px 22px; }
  .refused .r-title { font:600 18px var(--serif); color:var(--bad); letter-spacing:.01em; display:flex; align-items:center; gap:10px; }
  .refused .r-title::before { content:"⌀"; font-family:var(--mono); font-size:15px; opacity:.7; }
  .refused p { color:#4a3f28; font:400 14.5px/1.6 var(--serif); margin:9px 0 0; }

  .audit-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:16px 20px;
    border-bottom:1px solid var(--line); background:linear-gradient(#f7f0df,#f2ead6); border-radius:4px 4px 0 0; }
  .audit-grid { display:grid; grid-template-columns:1fr; }
  .finding { border-top:1px solid var(--line); }
  .finding:first-child { border-top:0; }
  .finding summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 20px; }
  .finding summary::-webkit-details-marker { display:none; }
  .finding summary:hover { background:rgba(245,238,221,.5); }
  .finding .f-label { font:600 14px var(--serif); color:#2b2415; }
  .finding .f-hint { color:var(--muted); font:italic 400 12.5px var(--serif); margin-left:8px; }
  .finding .count { font:700 12px var(--mono); padding:3px 10px; border-radius:999px; }
  .finding .count.zero { color:var(--muted); border:1px solid var(--line2); }
  .finding .count.some { color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 45%,transparent); background:color-mix(in srgb,var(--warn) 9%,transparent); }
  .finding .items { padding:0 20px 15px; display:flex; flex-direction:column; gap:6px; }
  .finding .items a { font:500 12px var(--mono); color:#5c4f34; text-decoration:none; }
  .finding .items a:hover { color:var(--brass-deep); }

  /* overlaps */
  .pair { padding:15px 20px; }
  .pair .p-top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .pair .sim { font:700 12px var(--mono); color:var(--brass-deep); }
  .rel { font:700 9.5px var(--mono); text-transform:uppercase; padding:3px 8px; border-radius:3px; letter-spacing:.08em; }
  .rel.contradict { color:var(--bad); background:color-mix(in srgb,var(--bad) 13%,transparent); }
  .rel.duplicate { color:var(--warn); background:color-mix(in srgb,var(--warn) 13%,transparent); }
  .rel.related, .rel.candidate, .rel.unrelated, .rel.unknown { color:var(--muted); background:#e7dcc4; }
  .pair .why { font:italic 400 13px/1.5 var(--serif); color:#4a3f28; margin:2px 0 10px; }
  .pair .sides { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  @media (max-width:640px){ .pair .sides { grid-template-columns:1fr; } }
  .pair .side { border:1px solid var(--line); border-radius:3px; padding:10px 12px; background:#f2ead6; }
  .pair .side a { font:600 11px var(--mono); color:#2b2415; text-decoration:none; }
  .pair .side a:hover { color:var(--brass-deep); }
  .pair .side .s-snip { font:400 12px/1.55 var(--serif); color:var(--muted); margin-top:6px; }

  .empty { color:var(--muted); font:italic 400 14px var(--serif); padding:26px 4px; text-align:center; }
  .err { color:var(--bad); font:500 13px var(--mono); padding:15px 20px; }
  .muted { color:var(--muted); }
  footer { color:var(--muted); font:500 11px var(--mono); letter-spacing:.08em; margin-top:44px; text-align:center; text-transform:uppercase; }
  footer::before { content:"❦ "; color:var(--sage); }
</style>
</head>
<body>
  <header class="masthead">
    <img src="/art/hero.jpg" alt="An archivist's bench: a brass magnifier over a manuscript, an engraved pocket watch, sage botanicals" />
    <div class="status-wrap"><span id="status" class="pill">indexing…</span></div>
    <div class="plate">
      <div class="wordmark">
        <h1>CAIRN</h1>
        <div class="rule"></div>
        <div class="tag">Find what you know — <b>and see exactly where it came from.</b> Nothing leaves this machine.</div>
      </div>
      <div class="ref">Ref · Knowledge Integrity · Local</div>
    </div>
  </header>

  <div class="wrap">
    <div class="instrument">
      <p class="eyebrow">Interrogate the record</p>
      <div class="searchbar">
        <input id="q" placeholder="Ask your vault… e.g. what did I decide about the pricing model?" autocomplete="off" />
        <button class="go" id="go">Search</button>
      </div>
      <div class="controls">
        <div class="seg" role="group" aria-label="mode">
          <button id="m-search" aria-pressed="true">Search</button>
          <button id="m-ask" aria-pressed="false">Ask</button>
        </div>
        <span class="ctrl-note" id="modenote">Ranked passages from your notes — no generation, no hallucination.</span>
        <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap">
          <button class="auditbtn" id="integritybtn" style="border-color:var(--brass); color:var(--brass-deep)">Integrity Report</button>
          <button class="auditbtn" id="overlapbtn">Overlaps</button>
          <button class="auditbtn" id="auditbtn">Audit</button>
        </div>
      </div>
    </div>

    <section id="out"></section>
    <footer id="foot">CAIRN · local · grounded · <span id="foot-ai"></span></footer>
  </div>

<script>
const $ = (s) => document.querySelector(s);
const state = { mode: 'search', ai: false, vault: '' };
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function obsidianLink(noteRel){
  if(!state.vault) return null;
  const file = noteRel.replace(/\.md$/,'');
  return `obsidian://open?vault=${encodeURIComponent(state.vault)}&file=${encodeURIComponent(file)}`;
}
function highlight(snip, qterms){
  let h = esc(snip);
  for(const t of (qterms||[])){ if(t.length<2) continue;
    h = h.replace(new RegExp('\\b('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','gi'),'<mark>$1</mark>'); }
  return h;
}
function crumb(h){ return h.headingPath && h.headingPath.length ? ' › '+h.headingPath.map(esc).join(' › ') : (h.heading?' › '+esc(h.heading):''); }
function openBtns(noteRel){
  const l = obsidianLink(noteRel);
  return `${l?`<a href="${l}">Open in Obsidian</a>`:''}<button data-path="${esc(noteRel)}">Copy path</button>`;
}
function hitCard(h, qterms){
  const links = (h.inbound||h.outlinks) ? `<span class="tag" title="backlinks in · links out">↖ ${h.inbound||0} · ${h.outlinks||0} ↗</span>` : '';
  return `<div class="card"><div class="hit">
    <div class="h-top"><div class="h-title">${esc(h.title)}<span class="crumb">${crumb(h)}</span></div>
      <div class="h-meta">${h.folder?esc(h.folder)+' · ':''}score ${h.score} · ${h.mtime}</div></div>
    <div class="snip">${highlight(h.snippet, qterms)}</div>
    <div class="h-foot">${openBtns(h.note)}${links}${(h.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
  </div></div>`;
}

// --- mode toggle ---
const NOTE = {
  search: 'Ranked passages from your notes — no generation, no hallucination.',
  ask: 'Synthesized answer, locked to your notes with citations — or "Not in your vault."',
};
function setMode(m){
  state.mode = m;
  $('#m-search').setAttribute('aria-pressed', m==='search');
  $('#m-ask').setAttribute('aria-pressed', m==='ask');
  $('#go').textContent = m==='ask' ? 'Ask' : 'Search';
  $('#modenote').textContent = (m==='ask' && !state.ai)
    ? 'Ask needs a model (set MODEL_API_KEY). Until then it returns grounded passages.'
    : NOTE[m];
}
$('#m-search').onclick=()=>setMode('search');
$('#m-ask').onclick=()=>setMode('ask');

// --- auth (closed mode): inject an API key from localStorage on every /api call.
// In open (local) mode there's no key and requests pass through unchanged. ---
function apiKey(){ return localStorage.getItem('cairn_key') || ''; }
function setApiKey(){
  const k = prompt('CAIRN API key (leave blank to clear):', apiKey());
  if(k===null) return;
  k ? localStorage.setItem('cairn_key', k) : localStorage.removeItem('cairn_key');
  location.reload();
}
function apiFetch(url, opts={}){
  const h = Object.assign({}, opts.headers||{});
  const k = apiKey(); if(k) h['Authorization'] = 'Bearer ' + k;
  return fetch(url, Object.assign({}, opts, { headers:h }));
}

// --- status ---
apiFetch('/api/status').then(async r=>{
  if(r.status===401 || r.status===403){
    const p = $('#status');
    p.textContent = '🔒 API key required — click to set';
    p.className = 'pill bad'; p.style.cursor='pointer'; p.onclick = setApiKey;
    return null;
  }
  return r.json();
}).then(s=>{
  if(!s) return;
  state.ai = s.ai; state.vault = s.vault_name || '';
  const p = $('#status');
  if(!s.ready){ p.textContent='no vault — set VAULT_DIR'; p.className='pill bad'; }
  else { p.textContent = `${s.notes} notes · ${s.chunks} chunks`; p.className='pill on'; }
  if(s.auth==='closed'){ p.title='closed mode — click to change API key'; p.style.cursor='pointer'; p.onclick=setApiKey; }
  state.embedded = s.embedded;
  $('#foot-ai').textContent = `${s.search_mode||'lexical'} · Ask ${s.ai?'on':'off'}`;
  setMode(state.mode);
}).catch(()=>{ $('#status').textContent='server error'; });

// --- run search / ask ---
async function run(){
  const q = $('#q').value.trim();
  if(!q) { $('#q').focus(); return; }
  const out = $('#out'); const btn = $('#go'); btn.disabled=true;
  out.innerHTML = `<div class="empty">${state.mode==='ask'?'Reading your notes…':'Searching…'}</div>`;
  try{
    const ep = state.mode==='ask' ? '/api/answer' : '/api/search';
    const res = await apiFetch(ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({q})});
    const d = await res.json();
    if(!res.ok || d.error) throw new Error(d.error||('HTTP '+res.status));
    render(d);
  }catch(err){ out.innerHTML = `<div class="card err">✕ ${esc(err.message)}</div>`; }
  finally{ btn.disabled=false; }
}
$('#go').onclick=run;
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });

function render(d){
  const out = $('#out');
  // refusal
  if(d.mode==='refused' || d.refused){
    const reason = d.reason || (d.answer||'').trim();
    out.innerHTML = `<div class="card refused"><div class="r-title">Not in your vault</div>
      <p>${esc(reason||'Nothing matched with enough confidence — CAIRN won\'t guess.')}</p>${receiptBar(d.receipt)}</div>`;
    if(d.hits && d.hits.length) out.innerHTML += `<div class="muted" style="font-size:12px;margin:4px 2px">Closest passages:</div>` + d.hits.slice(0,3).map(h=>hitCard(h,d.qterms)).join('');
    wireReceipt();
    return;
  }
  // grounded answer
  if(d.mode==='answer'){
    const cites = (d.citations||[]).map(c=>{ const l=obsidianLink(c.note);
      return `<a class="cite" ${l?`href="${l}"`:''}>[${c.n}] ${esc(c.note)}${c.heading?' › '+esc(c.heading):''}</a>`; }).join('');
    let body = esc(d.answer).replace(/\[(\d+)\]/g,'<sup><a href="#cite-$1">[$1]</a></sup>');
    out.innerHTML = `<div class="card answer">
      <div class="ahead"><span class="badge ok">Grounded answer</span><span class="badge">${d.grounded?'cited':'ungrounded'}</span><span class="badge">${esc(d.model||'')}</span></div>
      <div class="abody">${body}</div>${cites?`<div class="cites">${cites}</div>`:''}${receiptBar(d.receipt)}</div>`;
    if(d.hits) out.innerHTML += `<div class="muted" style="font-size:12px;margin:6px 2px">Sources:</div>` + d.hits.slice(0,6).map(h=>hitCard(h,d.qterms)).join('');
    wirePaths(); wireReceipt();
    return;
  }
  // passages
  if(!d.hits || !d.hits.length){ out.innerHTML = `<div class="empty">No matching passages.</div>`; return; }
  out.innerHTML = `<div class="muted" style="font-size:12px;margin:2px 2px">${d.hits.length} passage(s) · confidence ${d.confidence}</div>` + d.hits.map(h=>hitCard(h,d.qterms)).join('');
  wirePaths();
}
function wirePaths(){
  document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.dataset.path); b.textContent='Copied'; setTimeout(()=>b.textContent='Copy path',1200); });
}
let lastReceipt=null;
function downloadJSON(name,obj){ const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function receiptBar(rc){ if(!rc) return ''; lastReceipt=rc;
  const warn = rc.uncontrolled_source_warning
    ? `<span style="flex-basis:100%;font:600 11px var(--mono);color:var(--warn)">⚠ relies on a non-controlled source</span>` : '';
  return `<div class="cites" style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px;align-items:center">
    <span class="badge ${rc.verdict==='GROUNDED'?'ok':'bad'}">${esc(rc.verdict)}</span>
    <span class="cite" style="cursor:default">receipt ${esc(rc.receipt_sha256.slice(0,20))}…</span>
    <button class="cite" id="dl-receipt">Download receipt</button>${warn}</div>`;
}
function wireReceipt(){ const b=document.getElementById('dl-receipt'); if(b&&lastReceipt) b.onclick=()=>downloadJSON('cairn-receipt-'+lastReceipt.receipt_sha256.slice(0,8)+'.json', lastReceipt); }

// --- audit ---
$('#auditbtn').onclick = async () => {
  const out = $('#out'); out.innerHTML = `<div class="empty">Auditing vault…</div>`;
  try{
    const d = await (await apiFetch('/api/audit',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();
    const rows = d.findings.map(f=>{
      const n = f.items.length;
      const items = f.items.slice(0,50).map(it=>{
        const note = it.note || it.from || (it.notes&&it.notes[0]) || '';
        const label = it.link ? `${esc(it.from)} → [[${esc(it.link)}]]` : it.title ? `${esc(it.title)} — ${esc(note)}` : esc(note);
        const l = obsidianLink(note);
        return l ? `<a href="${l}">${label}</a>` : `<a>${label}</a>`;
      }).join('');
      return `<details class="finding" ${n&&f.key==='broken_links'?'open':''}>
        <summary><span><span class="f-label">${esc(f.label)}</span><span class="f-hint">${esc(f.hint)}</span></span>
          <span class="count ${n?'some':'zero'}">${n}</span></summary>
        ${n?`<div class="items">${items}${f.items.length>50?`<span class="muted">…and ${f.items.length-50} more</span>`:''}</div>`:''}
      </details>`;
    }).join('');
    out.innerHTML = `<div class="card"><div class="audit-head"><span class="badge">Vault audit</span>
      <span class="muted" style="font:500 12px var(--mono)">${d.total_notes} notes · ${d.total_chunks} chunks</span></div>
      <div class="audit-grid">${rows}</div></div>`;
  }catch(err){ out.innerHTML = `<div class="card err">✕ ${esc(err.message)}</div>`; }
};

// --- overlaps / contradictions ---
function pairCard(p){
  const rel = p.relation || 'candidate';
  const la = obsidianLink(p.a.note), lb = obsidianLink(p.b.note);
  return `<div class="card"><div class="pair">
    <div class="p-top"><span class="sim">~${p.similarity}</span><span class="rel ${esc(rel)}">${esc(rel)}</span></div>
    ${p.why?`<div class="why">${esc(p.why)}</div>`:''}
    <div class="sides">
      <div class="side"><a ${la?`href="${la}"`:''}>${esc(p.a.note)}${p.a.heading?' › '+esc(p.a.heading):''}</a><div class="s-snip">${esc(p.a.snippet)}</div></div>
      <div class="side"><a ${lb?`href="${lb}"`:''}>${esc(p.b.note)}${p.b.heading?' › '+esc(p.b.heading):''}</a><div class="s-snip">${esc(p.b.snippet)}</div></div>
    </div></div></div>`;
}
async function loadOverlaps(adjudicate){
  const out = $('#out');
  out.innerHTML = `<div class="empty">${adjudicate?'Classifying pairs with the local model (this is slow — a few seconds each)…':'Finding overlapping notes…'}</div>`;
  try{
    const d = await (await apiFetch('/api/contradictions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({threshold:0.8,max:12,adjudicate:!!adjudicate,limit:5})})).json();
    if(d.available===false){ out.innerHTML = `<div class="card refused"><div class="r-title">Overlap detection needs embeddings</div><p>${esc(d.reason||'')}</p></div>`; return; }
    if(!d.pairs.length){ out.innerHTML = `<div class="empty">No strongly-overlapping note pairs found. Your vault is tidy.</div>`; return; }
    const head = `<div class="card"><div class="audit-head"><span class="badge">Overlaps · same-topic note pairs</span>
      ${d.adjudicated?`<span class="muted" style="font:500 12px var(--mono)">classified by model</span>`
        :`<button class="auditbtn" id="adjbtn">Ask model to classify</button>`}</div></div>`;
    out.innerHTML = head + d.pairs.map(pairCard).join('');
    const adj = document.getElementById('adjbtn'); if(adj) adj.onclick=()=>loadOverlaps(true);
  }catch(err){ out.innerHTML = `<div class="card err">✕ ${esc(err.message)}</div>`; }
}
$('#overlapbtn').onclick = () => loadOverlaps(false);

// --- integrity report ---
$('#integritybtn').onclick = async () => {
  const out = $('#out'); out.innerHTML = `<div class="empty">Computing knowledge integrity report…</div>`;
  try{
    const d = await (await apiFetch('/api/integrity',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})).json();
    if(d.error) throw new Error(d.error);
    const col = d.integrity_score>=80?'var(--ok)':d.integrity_score>=60?'var(--warn)':'var(--bad)';
    const findings = d.findings.map(f=>`<details class="finding"><summary><span><span class="f-label">${esc(f.label)}</span><span class="f-hint">${esc(f.hint)}</span></span><span class="count ${f.count?'some':'zero'}">${f.count}</span></summary>${f.count?`<div class="items">${f.items.slice(0,40).map(it=>{const note=it.note||it.from||(it.notes&&it.notes[0])||'';const label=it.link?`${esc(it.from)} → [[${esc(it.link)}]]`:it.title?`${esc(it.title)} — ${esc(note)}`:esc(note);const l=obsidianLink(note);return l?`<a href="${l}">${label}</a>`:`<a>${label}</a>`;}).join('')}</div>`:''}</details>`).join('');
    const c = d.contradictions;
    const co = c.controlled_overlaps || 0;
    const contras = c.available
      ? `<details class="finding"${c.candidate_count?' open':''}><summary><span><span class="f-label">Contradiction candidates</span><span class="f-hint">Same-topic pairs — not yet confirmed; use Overlaps to classify${co?` · <span style="color:var(--warn);font-weight:700">${co} between controlled docs — review first</span>`:''}</span></span><span class="count ${c.candidate_count?'some':'zero'}">${c.candidate_count}</span></summary>${c.candidate_count?`<div class="items">${c.candidates.slice(0,20).map(p=>p.both_controlled?`<a style="color:var(--warn);font-weight:700">⚑ controlled · ~${p.similarity} · ${esc(p.a.note)} ↔ ${esc(p.b.note)}</a>`:`<a class="muted">~${p.similarity} · ${esc(p.a.note)} ↔ ${esc(p.b.note)}</a>`).join('')}</div>`:''}</details>`
      : `<div class="finding" style="padding:12px 18px"><span class="f-hint">${esc(c.note)}</span></div>`;
    const cc = d.controlled_coverage || {controlled:0,total:d.totals.notes};
    out.innerHTML = `<div class="card"><div class="audit-head">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="badge">Knowledge Integrity Report</span>
          <span style="font:700 34px/1 var(--serif);color:${col}">${d.integrity_score}<span style="font-size:15px;color:var(--muted)">/100</span></span>
          <span class="rel" style="color:${col};border:1px solid ${col}">Grade ${esc(d.grade)}</span>
          <span class="badge" title="Notes marked authoritative/controlling">Controlled: ${cc.controlled} / ${cc.total}</span></div>
        <button class="auditbtn" id="dl-report">Download report</button></div>
      <div class="audit-grid">${findings}${contras}</div>
      <div style="padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span class="cite" style="cursor:default">report_sha256 ${esc(d.report_sha256.slice(0,24))}…</span>
        <span class="muted" style="font:500 11px var(--mono)">${d.totals.notes} notes · ${esc((d.generated_at||'').slice(0,19))}Z</span></div></div>`;
    const dl=document.getElementById('dl-report'); if(dl) dl.onclick=()=>downloadJSON('cairn-integrity-'+d.report_sha256.slice(0,8)+'.json', d);
  }catch(err){ out.innerHTML = `<div class="card err">✕ ${esc(err.message)}</div>`; }
};
</script>
</body>
</html>
