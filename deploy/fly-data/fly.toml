# CAIRN Data Edition — live public instance. The AtScale-conversation URL: the synthetic
# Brightpath corpus where ARR is defined three ways and only one is governed. Ships its
# sealed ledger (ARR + NRR metric cards, receipts verifiable live at /api/ledger/verify).
# No model on the box: refusal is structural, passages carry provenance, nothing can run
# up a bill. The pitch: the semantic layer is the law; CAIRN audits everything that cites
# the law.
app = "cairn-data"
primary_region = "ord"

[build]
  dockerfile = "../../Dockerfile"

[env]
  HOST = "0.0.0.0"          # public demo box — synthetic data only
  PORT = "4600"
  CAIRN_PROFILE = "data"
  CAIRN_VAULT_DIR = "/app/demo/metrics-sample"   # VAULT_* is scrubbed by Fly machines
  CONTROLLED_DIRS = "governed"
  CAIRN_STATE_DIR = "/app/deploy/fly-data/state"
  EMBEDDINGS = "off"
  WATCH = "off"
  CAIRN_CORS_ORIGINS = "https://cairnsemantics.com,https://www.cairnsemantics.com"

[http_service]
  internal_port = 4600
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
