# CAIRN Law Edition — live public instance (the PROVING ROOM doctrine: ship the real
# thing, then the demo is a tour of production). Serves the synthetic Meridian v.
# Copperline matter with the law profile, pre-sealed held-knowledge cards, and the
# shipped receipt ledger — /api/ledger/verify recomputes the chain live.
#
# Refusal is STRUCTURAL (the confidence gate) and model-free. A small hosted model
# is wired for the synthesis step only, so a hit returns a grounded answer with [n]
# citations. MODEL_API_KEY is a Fly secret, never this file. Public surface is
# read-only (CAIRN_PUBLIC_READONLY) — visitors cannot mutate prefs or consolidate.
app = "cairn-law"
primary_region = "dfw"

[build]
  dockerfile = "../../Dockerfile"

[env]
  HOST = "0.0.0.0"          # public demo box — synthetic data only, nothing sensitive
  PORT = "4600"
  CAIRN_PROFILE = "law"
  CAIRN_PUBLIC_READONLY = "1"
  # Fly machines silently scrub VAULT_* env vars (reserved for HashiCorp Vault
  # integration) — the namespaced form survives.
  CAIRN_VAULT_DIR = "/app/demo/matter-sample"
  CAIRN_STATE_DIR = "/data"                   # Fly volume — ledger survives redeploy
  CAIRN_STATE_SEED = "/app/deploy/fly/state"  # baked cards receipts, copied on first boot
  EMBEDDINGS = "cache"
  WATCH = "off"
  # Synthesis only. Refusal still short-circuits before this endpoint is called.
  # Fireworks US (Kimi K2.7 Code). MODEL_API_KEY is a Fly secret. Only retrieved
  # snippets of a synthetic corpus leave the box.
  MODEL_BASE_URL = "https://api.fireworks.ai/inference/v1"
  MODEL_NAME = "accounts/fireworks/models/kimi-k2p7-code"
  CAIRN_CORS_ORIGINS = "https://cairnsemantics.com,https://www.cairnsemantics.com,https://cairnsemantics-*-lelandsequel-0aae5153.vercel.app,http://localhost:*"

[[mounts]]
  source = "cairn_data"
  destination = "/data"

[http_service]
  internal_port = 4600
  force_https = true
  auto_stop_machines = "stop"   # scale-to-zero: a 7-document index cold-starts in ~2s
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
