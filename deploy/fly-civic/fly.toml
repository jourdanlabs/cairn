# CAIRN Civic Edition — live public instance. Town of Alder Creek (synthetic): the
# clerk's nightmare — adopted law says ninety days, the published code still says one
# hundred twenty. Ships its sealed ledger (ordinance + official cards). Refusal of the
# fabricated "Ordinance 2026-11" is arithmetic. Synthesis (Fireworks US) is cite-or-refuse.
app = "cairn-civic"
primary_region = "ord"

[build]
  dockerfile = "../../Dockerfile"

[env]
  HOST = "0.0.0.0"          # public demo box — synthetic data only
  PORT = "4600"
  CAIRN_PROFILE = "civic"
  CAIRN_PUBLIC_READONLY = "1"
  CAIRN_VAULT_DIR = "/app/demo/town-sample"   # VAULT_* is scrubbed by Fly machines
  CONTROLLED_DIRS = "adopted"
  CAIRN_STATE_DIR = "/data"
  CAIRN_STATE_SEED = "/app/deploy/fly-civic/state"
  EMBEDDINGS = "cache"
  WATCH = "off"
  MODEL_BASE_URL = "https://api.fireworks.ai/inference/v1"
  MODEL_NAME = "accounts/fireworks/models/kimi-k2p7-code"
  CAIRN_CORS_ORIGINS = "https://cairnsemantics.com,https://www.cairnsemantics.com,https://cairnsemantics-*-lelandsequel-0aae5153.vercel.app,http://localhost:*"

[[mounts]]
  source = "cairn_data"
  destination = "/data"

[http_service]
  internal_port = 4600
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
